# Site settings
title: Pedogee
description: Enterprise Cybersecurity Consulting - Risk Assessments, Compliance, and Security Architecture
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.pedogee.com" # the base hostname & protocol for your site
logo: /assets/images/logo.png

# Company Information
email: contact@pedogee.com
# phone: "+1 (555) 123-4567"
address: "Kansas City, Missouri, USA"
linkedin: "https://linkedin.com/company/pedogee"
# twitter: "https://twitter.com/pedogee"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation
header_pages:
  - index.md
  - services.md
  - about.md
  - resources.md
  - contact.md

# Collections
collections:
  services:
    output: true
    permalink: /services/:name/
  team:
    output: true
    permalink: /team/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Pedogee Team"
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"

# Google Analytics
google_analytics: UA-XXXXXXXXX-X

# Form Integration
formspree_id: your_formspree_id

# SEO
twitter:
  username: pedogee
  card: summary

social:
  name: Pedogee
  links:
    # - https://twitter.com/pedogee
    - https://linkedin.com/company/pedogee

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md