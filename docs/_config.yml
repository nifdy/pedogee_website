title: "Pedogee"
description: "Data Clarity. Security Certainty."
url: "https://pedogee.com"       # e.g., https://<user>.github.io or custom domain
# baseurl: ""   # if deploying under a subpath
lang: en-US

# Branding
brand:
  primary: "#3B5BA5"
  white:   "#FAFBFC"
  teal:    "#0D9488"
  gray:    "#64748B"
  red:     "#DC2626"
  green:   "#059669"
  font_headings: "Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
  font_body:     "Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
  font_code:     "JetBrains Mono, SFMono-Regular, Menlo, Monaco, Consolas, monospace"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  posts:
    output: true
    permalink: /blog/:title/

nav:
  - title: Home
    url: /
  - title: Services
    url: /#services
  - title: Resources
    url: /#resources
  - title: About
    url: /about/
  - title: Contact
    url: /contact/